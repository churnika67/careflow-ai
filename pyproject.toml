[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "careflow-ai"
version = "0.1.0"
description = "Evidence-grounded healthcare operations intelligence"
requires-python = ">=3.12,<3.15"
dependencies = [
  "fastapi==0.116.1",
  "uvicorn==0.35.0",
  "pydantic-settings==2.10.1",
  "psycopg[binary]==3.2.9",
  "httpx==0.28.1",
  "redis==6.4.0",
  "langgraph==1.2.12",
]

[project.optional-dependencies]
dev = ["pytest==8.4.1", "pytest-asyncio==1.1.0", "ruff==0.12.9"]
ingestion = [
  "beautifulsoup4==4.13.5",
  "sentence-transformers==5.1.0",
  "transformers==4.55.4",
  "torch==2.8.0",
  "qdrant-client==1.15.1",
  "numpy==2.3.2",
  "filelock==3.32.6",
]

[tool.setuptools.packages.find]
where = ["backend", "."]
include = ["app*", "ingestion*", "evaluation*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
